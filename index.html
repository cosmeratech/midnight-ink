<!DOCTYPE html>
<html>
<head>
    <title>Signature App</title>
    <link rel="stylesheet" href="style.css">
       <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
  crossorigin="anonymous"/>
</head>
<body style="background:dimgray;">

<div class="container flex justify-center items-center">
    <h1 class="title text-center"><u><i>Midnight Ink</u></i></h1>
</div>

    <div class="main">
        <div class="top">
            <div class="block">
                <p>Text color picker</p>
                <input class="form-control" type="color" id="colorPicker">
            </div>
            <div class="block">
                <p>Background</p>
                <input class="form-control" type="color" id="canvasColor">
            </div>
            <div class="block">
                <p>Font size</p>
                <select class="custom-select" type="select" id="fontSizePicker">
                    <option value="4">4px</option>
                    <option value="6">6px</option>
                    <option value="8">8px</option>
                    <option value="12">12px</option>
                    <option value="16">16px</option>  
                </select>
            </div>
        </div>

        <canvas class="canvas" id="myCanvas" width="800" height="500"></canvas>
        <div class="bottom">
            <button type="button" class="btn btn-danger" id="clearButton">Clear</button>
            <button type="button" class="btn btn-success" id="saveButton">Save & download</button>
            <button type="button" class="btn btn-warning" id="retrieveButton">Retrieve saved signature</button>
        </div>
        <div id="footer">
        <h6>Powered by tea breaks ☕ <a target="_blank" href="https://www.github.com/cosmeratech">Jèh (COSMèra)</a></h6>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
